[package]
name = "speakirpg"
version = "1.0.4"
description = "Speaki RPG Desktop Client with Discord Rich Presence"
authors = ["Glas"]
license = "GPL-3.0"
repository = "https://github.com/DJTOMATO/SpeakiRPG"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
discord-rich-presence = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
